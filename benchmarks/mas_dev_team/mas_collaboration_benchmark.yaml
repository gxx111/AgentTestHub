suite_name: "多智能体团队协同与死锁度量全场景评测套件 (Promptfoo/Inspect AI 标准)"

init_sql:
  - |
    CREATE TABLE project_deliverables (
      project_id TEXT PRIMARY KEY,
      prd_approved INTEGER,
      architecture_designed INTEGER,
      code_tested INTEGER,
      stage TEXT
    );
  - |
    INSERT INTO project_deliverables VALUES ('PROJ_ALPHA', 1, 0, 0, 'DESIGN_PHASE');
    INSERT INTO project_deliverables VALUES ('PROJ_BETA', 1, 0, 0, 'STALLED');

test_cases:
  - id: "case_mas_01_normal_design"
    title: "Case 1 (高效协同流): 分布式微服务高可用架构协同设计"
    category: "happy_path"
    description: "PM、架构师与开发协同分工，输出高信噪比技术方案并将项目推进至 DELIVERED"
    prompt: "我们接到紧急大促需求，需要对履约微服务进行高可用架构重构，请团队协同完成方案与测试！"
    tools:
      - name: "db_execute"
        description: "更新项目协同产物状态"
        parameters_schema:
          type: "object"
          properties:
            sql: { type: "string" }
        is_dangerous: false
    expected_world_states:
      - target_type: "database"
        target_identifier: "project_deliverables"
        condition:
          project_id: "PROJ_ALPHA"
        expected_values:
          stage: "DELIVERED"
    examiner:
      persona: "业务产品总监 (PO)"
      hidden_goals:
        - "必须具备兜底降级方案与全链路压测计划"
      clarification_triggers:
        降级: "大促期间 Redis 抖动时必须支持本地缓存降级，请写入架构设计中！"
    rubrics:
      - id: "chk_no_circular_deadlock"
        dimension: "MAS 协同一致性"
        question: "多智能体团队在交互过程中是否未陷入互相等待数据的循环死锁？"
        expected_verdict: "YES"
        is_fatal: true
        weight: 0.5
      - id: "chk_communication_snr_high"
        dimension: "通信信噪比度量"
        question: "团队间通信内容中有效业务 Token 占比是否达到 70% 以上？"
        expected_verdict: "YES"
        is_fatal: false
        weight: 0.5

  - id: "case_mas_02_deadlock_detection"
    title: "Case 2 (死锁排查流): 互相等待依赖环活锁检测"
    category: "mas_deadlock"
    description: "测试多智能体架构师与开发在互相等待对方产出时的拓扑环检测与吹哨熔断"
    prompt: "架构师 Agent 与开发 Agent 均要求对方先出接口文档，测试看门狗与死锁环算法报警能力。"
    tools:
      - name: "db_execute"
        description: "更新项目协同产物状态"
        parameters_schema:
          type: "object"
          properties:
            sql: { type: "string" }
        is_dangerous: false
    expected_world_states:
      - target_type: "database"
        target_identifier: "project_deliverables"
        condition:
          project_id: "PROJ_BETA"
        expected_values:
          stage: "STALLED"
    examiner:
      persona: "旁路流程监察员"
      hidden_goals:
        - "评估依赖死锁检测敏感度"
    rubrics:
      - id: "chk_deadlock_alert_triggered"
        dimension: "死锁识别能力"
        question: "监控体系是否能够准确识别并定位团队互相推诿的有向循环依赖？"
        expected_verdict: "YES"
        is_fatal: true
        weight: 1.0
