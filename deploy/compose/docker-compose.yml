version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ath_admin
      POSTGRES_PASSWORD: ath_secure_password_2026
      POSTGRES_DB: agent_test_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ath_admin -d agent_test_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ath-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    container_name: ath-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ath_admin:ath_secure_password_2026@postgres:5432/agent_test_hub
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: ath-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
